<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Documentos - Expediente{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .file-info { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .car-item { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .car-photo { max-width: 200px; height: auto; }
        .upload-form { background: #f9f9f9; padding: 20px; border-radius: 5px; margin: 20px 0; }
        .form-group { margin: 15px 0; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select, textarea { padding: 8px; border: 1px solid #ddd; border-radius: 3px; }
        button { background: #007cba; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #005a87; }
        .alert { padding: 15px; margin: 10px 0; border-radius: 5px; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>{% block header %}Sistema de Documentos{% endblock %}</h1>
            <nav>
                <a href="{% url 'documentos:index' %}">Inicio</a> |
                <a href="{% url 'documentos:car_list' %}">Vehículos</a> |
                <a href="{% url 'documentos:upload_file' %}">Subir Archivo</a> |
                <a href="{% url 'documentos:form_examples' %}">📝 Ejemplos Formularios</a>
            </nav>
        </header>
        
        <main>
            {% block content %}
            {% endblock %}
        </main>
        
        <footer>
            <hr>
            <p><small>Sistema de Expedientes - Ejemplo de manejo de archivos en Django</small></p>
        </footer>
    </div>
</body>
</html>
